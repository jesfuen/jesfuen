name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Se ejecuta cada día a medianoche
  workflow_dispatch:        # Permite ejecutarlo manualmente desde GitHub
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jesfuen
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=blueviolet&color_dots=#0d1117,#2d1b69,#4c1d95,#7c3aed,#a855f7
            dist/github-contribution-grid-snake-dark.svg?color_snake=blueviolet&color_dots=#0d1117,#2d1b69,#4c1d95,#7c3aed,#a855f7
      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
